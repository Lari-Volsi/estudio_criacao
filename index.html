/* ===== Identidade visual EFAI (ID_EFAI_2026) ===== */
:root{
  --vermelho:#e04c48;        /* P1 */
  --vermelho-texto:#c73935;  /* P2 títulos, destaques, labels */
  --verde:#88d188;           /* P3 */
  --azul:#10a6e8;            /* P4 */
  --azul-texto:#0878b5;      /* P5 títulos, destaques, labels */
  --amarelo:#f4ca60;         /* S1 */
  --roxo:#bf6cef;            /* S2 */
  --preto:#1f1823;           /* S3 textos e strokes */
  --offwhite:#fffdf3;        /* S4 */
  --grad-lilas:rgba(217,185,232,.5);
  --grad-amarelo:rgba(244,219,155,.5);
  --verde-claro:#e3f4e3;
  --amarelo-claro:#fdf3d6;
  --azul-claro:#e2f4fc;
  --roxo-claro:#f3e6fb;

  --font-titulo:'Bai Jamjuree','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --font-texto:'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif;

  --fs-display:clamp(2rem,1.2rem + 2.8vw,3.5rem);
  --fs-h1:clamp(1.7rem,1.2rem + 1.8vw,2.6rem);
  --fs-h2:clamp(1.4rem,1.1rem + 1.1vw,2rem);
  --fs-instrucao:clamp(1.15rem,1rem + .55vw,1.5rem);
  --fs-body-l:clamp(1.1rem,1.04rem + .3vw,1.25rem);
  --fs-label:.8125rem;
  --raio:16px;
  --sombra:0 10px 24px -14px rgba(31,24,35,.45);
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100%;background-color:var(--offwhite);
  background-image:linear-gradient(120deg,var(--grad-lilas) 0%,var(--grad-amarelo) 100%)}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;
  font-family:var(--font-texto);font-size:1rem;line-height:1.5;color:var(--preto);-webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:var(--font-titulo);margin:0;line-height:1.1}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:4px solid var(--azul-texto);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Faixas e barra superior (mesma linguagem das aulas anteriores) ===== */
.faixa{display:flex;height:8px}
.faixa span{flex:1}
.faixa-topo span:nth-child(1){background:var(--vermelho)}
.faixa-topo span:nth-child(2){background:var(--azul)}
.faixa-topo span:nth-child(3){background:var(--verde)}
.faixa-base span:nth-child(1){background:var(--amarelo)}
.faixa-base span:nth-child(2){background:var(--roxo)}
.barra{width:100%;max-width:1320px;margin:0 auto;padding:10px clamp(16px,2.5vw,32px) 0;display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
#passos-barra:empty{display:none}
@media (max-width:760px){#passos-barra{order:3;flex-basis:100%}.passos{flex-wrap:wrap}}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--preto);border-radius:999px;padding:4px 12px;
  font-weight:600;font-size:var(--fs-label);letter-spacing:.04em;text-transform:uppercase;background:var(--offwhite);white-space:nowrap}
.pill svg{width:16px;height:16px}
main{width:100%;max-width:1320px;margin:0 auto;padding:10px clamp(16px,2.5vw,32px) 14px;display:grid;min-height:0}

/* ===== Botões ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;min-width:54px;padding:0 24px;border-radius:999px;
  font-family:var(--font-titulo);font-weight:700;font-size:1.15rem;letter-spacing:.03em;
  border:2.5px solid var(--preto);background:var(--offwhite);color:var(--preto);cursor:pointer;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;transition:transform .12s ease,box-shadow .12s ease;box-shadow:0 4px 0 var(--preto);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--preto)}
.btn-verde{background:var(--verde)}
.btn-azul{background:var(--azul)}
.btn-amarelo{background:var(--amarelo)}
.btn-contorno{background:transparent;box-shadow:none;border-width:2px}
.btn-contorno:active{transform:none;background:rgba(31,24,35,.06)}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
.btn svg{width:22px;height:22px;flex:none}
.btn-pequeno{min-height:46px;padding:0 16px;font-size:1rem;box-shadow:0 3px 0 var(--preto)}

.ajuste{position:relative;contain:size;min-height:var(--min,120px)}
.ajuste > img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.img-ausente{display:grid;place-items:center;text-align:center;border:2px dashed rgba(31,24,35,.3);border-radius:8px;color:rgba(31,24,35,.65);font-size:.875rem;padding:6px;background:rgba(255,253,243,.7)}
.ajuste > .img-ausente{position:absolute;inset:0}

/* ===== Tela inicial ===== */
.inicio{display:grid;gap:clamp(16px,3vw,40px);align-items:center;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.inicio-texto{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.titulo-display{font-size:var(--fs-display);font-weight:700;letter-spacing:-.01em;line-height:1.02}
.faixa-texto{position:relative;isolation:isolate;display:inline-block;font-family:var(--font-titulo);font-weight:700;
  font-size:clamp(1.1rem,.9rem + .9vw,1.6rem);letter-spacing:.02em;line-height:1.15;padding:.3em .6em .32em}
.faixa-texto::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--cor,var(--amarelo));clip-path:polygon(1% 6%,100% 0,99% 100%,0 94%)}
.lead{font-size:var(--fs-body-l);max-width:34ch}
.botoes-inicio{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.capa{position:relative;height:100%;min-height:260px;margin:0}
.capa::before{content:"";position:absolute;left:50%;top:52%;width:min(78%,72vh);aspect-ratio:1;border-radius:50%;background:var(--amarelo);opacity:.55;transform:translate(-50%,-50%)}
.capa .forma-a{position:absolute;left:4%;bottom:6%;width:18%;aspect-ratio:1;background:var(--roxo);border-radius:100% 0 0 0}
.capa .forma-b{position:absolute;right:4%;top:6%;width:22%;aspect-ratio:2/1;border:2px solid var(--azul);border-top:0;border-radius:0 0 999px 999px}
.capa .ajuste{position:absolute;inset:0;min-height:0}
@media (orientation:portrait),(max-width:760px){
  .inicio{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto}
  .capa{order:-1}
}

/* ===== Escolha do aparelho ===== */
.escolha{display:grid;grid-template-rows:auto 1fr auto;gap:clamp(12px,2vh,22px)}
.escolha-titulo{font-size:var(--fs-h1);font-weight:700;text-align:center}
.opcoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,3vw,40px);max-width:980px;width:100%;margin:0 auto}
.opcao{display:grid;grid-template-rows:1fr auto;gap:10px;padding:12px 12px 16px;background:var(--offwhite);border:3px solid var(--preto);border-radius:22px;
  cursor:pointer;box-shadow:0 6px 0 var(--preto);touch-action:manipulation;transition:transform .12s ease,box-shadow .12s ease}
.opcao:active{transform:translateY(4px);box-shadow:0 2px 0 var(--preto)}
.opcao .ajuste{--min:140px;border-radius:14px;overflow:hidden}
.opcao .ajuste > img{object-fit:cover}
.opcao-texto{font-family:var(--font-titulo);font-weight:700;font-size:clamp(1.15rem,1rem + .8vw,1.6rem);display:flex;align-items:center;justify-content:center;gap:10px}
.opcao-texto svg{width:28px;height:28px}
.opcao[aria-pressed="true"]{background:var(--verde-claro);border-color:var(--azul-texto)}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ===== Estrutura das etapas ===== */
.etapa{display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:0}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px 18px;flex-wrap:wrap}
.instrucao{font-family:var(--font-titulo);font-weight:600;font-size:var(--fs-instrucao);line-height:1.2;padding-left:12px;border-left:6px solid var(--verde)}
.passos{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.passos li{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;border:1.5px solid rgba(31,24,35,.25);
  font-size:.8rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--offwhite);color:rgba(31,24,35,.6)}
.passos .num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(31,24,35,.12);color:var(--preto);font-family:var(--font-titulo)}
.passos li[aria-current="step"]{border-color:var(--preto);color:var(--preto)}
.passos li[aria-current="step"] .num{background:var(--amarelo)}
.passos li.feito .num{background:var(--verde)}
.navegacao{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px solid rgba(31,24,35,.12);padding-top:10px}
.navegacao .btn{min-height:52px;font-size:1.08rem;padding:0 22px}
.aviso-nav{font-size:.95rem;color:rgba(31,24,35,.75);flex:1 1 200px;text-align:right}

/* ===== Etapa 1: estúdio ===== */
.estudio{display:grid;grid-template-columns:clamp(250px,24vw,300px) minmax(0,1fr);gap:clamp(12px,1.6vw,22px);min-height:0}
.ferramentas{display:flex;flex-direction:column;gap:10px;background:var(--offwhite);border-radius:var(--raio);box-shadow:var(--sombra);padding:12px 14px;align-self:start}
.grupo-rotulo{font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--vermelho-texto);margin-bottom:5px}
.linha-botoes{display:grid;gap:7px}
.dois{grid-template-columns:repeat(2,minmax(0,1fr))}
.quatro{grid-template-columns:repeat(4,minmax(0,1fr))}
.ferr{
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:4px 8px;border-radius:14px;
  border:2.5px solid var(--preto);background:#fff;cursor:pointer;touch-action:manipulation;font-weight:700;font-size:.95rem;
}
.ferr svg{width:24px;height:24px;flex:none}
.ferr[aria-pressed="true"]{background:var(--amarelo);box-shadow:inset 0 -4px 0 rgba(31,24,35,.18)}
.ferr-forma{min-height:46px;padding:4px}
.ferr-forma svg{width:30px;height:30px}
.cores{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cor{width:100%;max-width:40px;aspect-ratio:1;justify-self:center;border-radius:50%;border:2.5px solid var(--preto);cursor:pointer;padding:0;touch-action:manipulation;position:relative}
.cor[aria-pressed="true"]{box-shadow:0 0 0 3px var(--offwhite),0 0 0 6px var(--azul-texto)}
.bichos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bicho-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px 3px;min-height:64px;border-radius:14px;border:2.5px solid var(--preto);background:#fff;cursor:pointer;touch-action:manipulation;font-weight:700;font-size:.72rem;line-height:1.1}
.bicho-btn .recorte{max-width:100%}
.recorte{position:relative;height:var(--alt,40px);aspect-ratio:var(--ar);overflow:hidden;display:block}
.recorte img{position:absolute;max-width:none;display:block;pointer-events:none}

.palco{display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;min-height:0}
.linha-cenario{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cenario-btn{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:3px 12px 3px 4px;border-radius:999px;border:2px solid var(--preto);background:#fff;cursor:pointer;touch-action:manipulation;font-weight:600;font-size:.9rem}
.limpar-tudo{margin-left:auto;min-height:42px}
.cenario-btn i{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(31,24,35,.3);display:block}
.cenario-btn[aria-pressed="true"]{background:var(--amarelo)}
.area-desenho{position:relative;contain:size;min-height:220px;display:grid;place-items:center}
.quadro{position:relative;border-radius:12px;box-shadow:0 0 0 4px var(--preto),0 14px 30px -16px rgba(31,24,35,.6);background:#fff}
#tela{display:block;border-radius:12px;touch-action:none;cursor:crosshair}
#tela.modo-mover{cursor:grab}
#tela.arrastando{cursor:grabbing}
.acoes{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acoes .btn-pequeno{padding:0 13px;gap:7px}
.acoes .sep{flex:1 1 10px}
.dica-ferr{font-size:.95rem;font-weight:600;color:var(--azul-texto);display:flex;align-items:center;gap:6px;min-height:1.4em}
.dica-ferr svg{width:18px;height:18px;flex:none}

@media (orientation:portrait),(max-width:900px){
  .estudio{grid-template-columns:minmax(0,1fr)}
  .ferramentas{order:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;align-self:stretch}
  .palco .area-desenho{min-height:clamp(260px,46vh,560px)}
}
@media (max-width:560px){.ferramentas{grid-template-columns:minmax(0,1fr)}}

/* ===== Etapa 2: escrita ===== */
.escrita{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(14px,2vw,28px);min-height:0;align-items:start}
.previa-col{display:flex;flex-direction:column;gap:12px}
.previa{position:relative;width:min(100%,calc(40vh * 1.5));aspect-ratio:3/2;border-radius:12px;box-shadow:0 0 0 4px var(--preto),var(--sombra);overflow:hidden;background:#fff}
.previa canvas{width:100%;height:100%;display:block}
.ideias{background:var(--offwhite);border-radius:var(--raio);box-shadow:var(--sombra);padding:12px 16px}
.ideias ul{margin:8px 0 0;padding-left:22px;display:grid;gap:4px;font-size:1.05rem;font-weight:600}
.campos{display:flex;flex-direction:column;gap:8px;background:var(--offwhite);border-radius:var(--raio);box-shadow:var(--sombra);padding:clamp(14px,1.8vw,22px)}
.rotulo-azul{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--azul-texto)}
.rotulo-azul svg{width:20px;height:20px}
.campo{
  width:100%;font-family:var(--font-texto);font-weight:500;font-size:clamp(1.15rem,1.05rem + .45vw,1.4rem);line-height:1.45;
  color:var(--preto);background:#fff;border:3px dashed var(--azul-texto);border-radius:14px;padding:10px 14px;
  box-shadow:0 0 0 5px var(--azul-claro);caret-color:var(--vermelho-texto);-webkit-appearance:none;appearance:none;scroll-margin:24px;
}
.campo-titulo{font-weight:700}
.campo::placeholder{color:rgba(31,24,35,.42);font-weight:600;font-size:.78em;letter-spacing:.04em}
.campo:focus{outline:none;border-style:solid;border-color:var(--azul);box-shadow:0 0 0 5px rgba(16,166,232,.35)}
textarea.campo{resize:vertical;height:clamp(110px,22vh,300px);min-height:96px}
.confira{border-top:2px dashed rgba(31,24,35,.18);padding-top:10px}
.confira-lista{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:0 22px}
.confira label{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:600;cursor:pointer;min-height:36px}
.rotulo-linha{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.confira input{width:26px;height:26px;accent-color:var(--verde);flex:none}
.dica-aparelho{font-size:.92rem;color:rgba(31,24,35,.75);display:flex;gap:6px;align-items:center}
.dica-aparelho svg{width:18px;height:18px;flex:none}
@media (orientation:portrait),(max-width:900px){
  .escrita{grid-template-columns:minmax(0,1fr)}
  .previa-col{flex-direction:row;align-items:flex-start}
  .previa{width:min(46%,360px);flex:none}
  .ideias{flex:1}
}
@media (max-width:560px){.previa-col{flex-direction:column}.previa{width:100%}}

/* ===== Etapa 3: página do livro ===== */
.final{display:grid;grid-template-rows:auto 1fr;gap:12px;align-content:start}
.botoes-final{display:flex;gap:12px;flex-wrap:wrap}
.pagina{
  width:100%;max-width:980px;margin:0 auto;background:#fff;border:3px solid var(--preto);border-radius:18px;box-shadow:var(--sombra);
  padding:clamp(16px,2.6vw,34px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(14px,2.4vw,30px);align-items:start;
}
.pagina-titulo{grid-column:1/-1;font-size:var(--fs-h1);font-weight:700;text-align:center;overflow-wrap:anywhere}
.pagina-ilustracao{width:100%;aspect-ratio:3/2;border-radius:10px;border:2px solid rgba(31,24,35,.2);overflow:hidden}
.pagina-ilustracao canvas{width:100%;height:100%;display:block}
.pagina-texto{font-size:clamp(1.1rem,1rem + .4vw,1.35rem);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
@media (orientation:portrait),(max-width:820px){.pagina{grid-template-columns:minmax(0,1fr)}}
.pronta{font-family:var(--font-titulo);font-weight:700;font-size:clamp(1.15rem,1rem + .6vw,1.5rem);color:var(--vermelho-texto)}

/* ===== Janelas (confirmação e salvar) ===== */
.modal-fundo{position:fixed;inset:0;z-index:50;background:rgba(31,24,35,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(560px,100%);background:var(--offwhite);border:3px solid var(--preto);border-radius:22px;padding:20px 22px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:var(--fs-h2);font-weight:700}
.modal .botoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.opcao-salvar{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 16px;border-radius:16px;border:2.5px solid var(--preto);background:#fff;cursor:pointer;box-shadow:0 4px 0 var(--preto);touch-action:manipulation}
.opcao-salvar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--preto)}
.opcao-salvar[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.opcao-salvar svg{width:38px;height:38px;flex:none}
.opcao-salvar b{font-family:var(--font-titulo);font-size:1.2rem;display:block}
.opcao-salvar small{font-size:.92rem;color:rgba(31,24,35,.75)}
.retorno{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;border:2px solid var(--preto);font-weight:600}
.retorno.certo{background:var(--verde-claro)}
.retorno.dica{background:var(--amarelo-claro)}

/* ===== Versão para impressão / PDF (só título, ilustração e história) ===== */
.impressao{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm}
  html,body{background:#fff !important;display:block;min-height:0}
  body > *:not(.impressao){display:none !important}
  .impressao{display:block;color:#1f1823}
  .impressao h1{font-family:var(--font-titulo);font-size:26pt;line-height:1.15;text-align:center;margin:0 0 6mm;overflow-wrap:anywhere}
  .impressao img{display:block;width:100%;height:auto;border:1px solid #bbb;border-radius:3mm;margin:0 0 7mm;break-inside:avoid}
  .impressao p{font-family:var(--font-texto);font-size:14pt;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;orphans:2;widows:2}
}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<body>
<div class="faixa faixa-topo" aria-hidden="true"><span></span><span></span><span></span></div>
<header class="barra">
  <span class="pill">Bichos em Formas</span>
  <div id="passos-barra"></div>
  <span class="pill" id="modo-pill" hidden></span>
</header>
<main id="app" tabindex="-1"><noscript><p>Para usar o estúdio, ative o JavaScript no navegador.</p></noscript></main>
<div class="faixa faixa-base" aria-hidden="true"><span></span><span></span></div>
<section class="impressao" id="impressao" aria-hidden="true"></section>

<script>
"use strict";
/* =========================================================
   DADOS
   ========================================================= */
const IMG = { capa: "./capa_pixy_code.png", computador: "./computador.png", tablet: "./tablet.png" };

// Bichos: os PNG têm 1920×1080 com fundo transparente; "visivel" é a área ocupada pelo animal.
// Se o arquivo tiver outro tamanho, a imagem inteira é usada.
const BICHOS = {
  pato:   { nome: "Patinho", src: "./pato.png",   visivel: [296, 167, 1618, 991] },
  gato:   { nome: "Gato",    src: "./gato.png",   visivel: [598, 91, 1410, 1013] },
  baleia: { nome: "Baleia",  src: "./baleia.png", visivel: [215, 96, 1678, 1014] },
  coelho: { nome: "Coelho",  src: "./coelho.png", visivel: [444, 67, 1426, 1036] }
};
const TAM_ORIGINAL = [1920, 1080];

const CORES = [
  { id: "vermelho", nome: "Vermelho", hex: "#e04c48" },
  { id: "amarelo",  nome: "Amarelo",  hex: "#f4ca60" },
  { id: "verde",    nome: "Verde",    hex: "#88d188" },
  { id: "azul",     nome: "Azul",     hex: "#10a6e8" },
  { id: "roxo",     nome: "Roxo",     hex: "#bf6cef" },
  { id: "preto",    nome: "Preto",    hex: "#1f1823" },
  { id: "branco",   nome: "Branco",   hex: "#fffdf3" }
];
const FORMAS = {
  circulo:   { nome: "Círculo",   w: 170, h: 170 },
  quadrado:  { nome: "Quadrado",  w: 170, h: 170 },
  triangulo: { nome: "Triângulo", w: 190, h: 170 },
  retangulo: { nome: "Retângulo", w: 260, h: 150 }
};
// Verde da grama dos cenários: mais escuro que o verde dos bichos (#88d188), para não se misturar
const GRAMA = "#4e9e5b", GRAMA_BORDA = "#3f8a4c";
const CENARIOS = {
  claro:  { nome: "Claro" },
  ceu:    { nome: "Céu" },
  jardim: { nome: "Jardim" },
  lago:   { nome: "Lago" }
};

// Área de desenho em coordenadas fixas (as posições não mudam com o tamanho da tela)
const W = 1200, H = 800;
const ESPESSURA = 12;

/* =========================================================
   ESTADO
   ========================================================= */
const CHAVE = "bichos-em-formas-estudio-v1";
function estadoInicial() {
  return {
    tela: "inicio",          // inicio | aparelho | desenho | escrita | final
    modo: null,              // "pc" | "tablet"
    cenario: "claro",
    objetos: [],             // traços, formas e bichos (em ordem de desenho)
    cor: "azul",
    ferramenta: "mover",     // "mover" | "lapis"
    titulo: "", historia: "",
    confira: [false, false, false],
    ideias: false
  };
}
let estado = estadoInicial();
let selecionado = -1;        // índice do objeto selecionado
let historico = [];          // para DESFAZER

// Salvamento temporário no navegador (se o navegador permitir)
let esperaSalvar;
function guardar() {
  clearTimeout(esperaSalvar);
  esperaSalvar = setTimeout(() => {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* armazenamento indisponível: segue normalmente */ }
  }, 300);
}
function recuperar() {
  try {
    const t = localStorage.getItem(CHAVE);
    if (!t) return null;
    const s = JSON.parse(t);
    return s && Array.isArray(s.objetos) ? Object.assign(estadoInicial(), s) : null;
  } catch (e) { return null; }
}
function apagarGuardado() { try { localStorage.removeItem(CHAVE); } catch (e) {} }
const temConteudo = s => s && (s.objetos.length > 0 || s.titulo.trim() || s.historia.trim() || s.cenario !== "claro");

/* =========================================================
   IMAGENS DOS BICHOS
   ========================================================= */
const imagens = {};
Object.entries(BICHOS).forEach(([id, b]) => {
  const img = new Image();
  img.onload = () => { desenharTudo(); };
  img.onerror = () => { b.falhou = true; desenharTudo(); };
  img.src = b.src;
  imagens[id] = img;
});
// área visível em frações da imagem
function recorte(id) {
  const b = BICHOS[id], img = imagens[id];
  const nw = img.naturalWidth || TAM_ORIGINAL[0], nh = img.naturalHeight || TAM_ORIGINAL[1];
  const v = (nw === TAM_ORIGINAL[0] && nh === TAM_ORIGINAL[1]) ? b.visivel : [0, 0, nw, nh];
  return { x0: v[0] / nw, y0: v[1] / nh, x1: v[2] / nw, y1: v[3] / nh, ar: (v[2] - v[0]) / (v[3] - v[1]) };
}

/* =========================================================
   DESENHO DA CENA (o mesmo código desenha o estúdio, as prévias e os arquivos salvos)
   ========================================================= */
function desenharCenario(ctx, id) {
  ctx.save();
  if (id === "claro") { ctx.fillStyle = "#fffdf3"; ctx.fillRect(0, 0, W, H); }
  else if (id === "ceu") {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#bfe6fa"); g.addColorStop(1, "#eef8fd");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f4ca60"; ctx.beginPath(); ctx.arc(1065, 130, 70, 0, Math.PI * 2); ctx.fill();
  } else if (id === "jardim") {
    ctx.fillStyle = "#e2f4fc"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = GRAMA; ctx.fillRect(0, H * 0.66, W, H * 0.34);
    ctx.fillStyle = GRAMA_BORDA; ctx.fillRect(0, H * 0.66, W, 10);
  } else if (id === "lago") {
    ctx.fillStyle = "#e2f4fc"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = GRAMA; ctx.fillRect(0, H * 0.56, W, H * 0.44);
    ctx.fillStyle = GRAMA_BORDA; ctx.fillRect(0, H * 0.56, W, 10);
    ctx.fillStyle = "#7fcdf2"; ctx.beginPath(); ctx.ellipse(W * 0.52, H * 0.8, W * 0.4, H * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fffdf3"; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(W * 0.38, H * 0.78); ctx.quadraticCurveTo(W * 0.42, H * 0.75, W * 0.46, H * 0.78); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W * 0.56, H * 0.84); ctx.quadraticCurveTo(W * 0.6, H * 0.81, W * 0.64, H * 0.84); ctx.stroke();
  }
  ctx.restore();
}

// desenhada com o centro em (0,0); a posição e o giro são aplicados antes
function caminhoForma(ctx, o) {
  const x = -o.w / 2, y = -o.h / 2;
  ctx.beginPath();
  if (o.f === "circulo") ctx.ellipse(0, 0, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
  else if (o.f === "triangulo") { ctx.moveTo(0, y); ctx.lineTo(x + o.w, y + o.h); ctx.lineTo(x, y + o.h); ctx.closePath(); }
  else ctx.rect(x, y, o.w, o.h);
}
const RAD = Math.PI / 180;
function noCentro(ctx, o) { ctx.translate(o.x, o.y); if (o.rot) ctx.rotate(o.rot * RAD); }

function desenharObjeto(ctx, o) {
  if (o.t === "traco") {
    const p = o.pts;
    ctx.strokeStyle = o.cor; ctx.fillStyle = o.cor; ctx.lineWidth = o.esp; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], o.esp / 2, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) {
      const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
      ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my);
    }
    ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]); ctx.stroke();
  } else if (o.t === "forma") {
    ctx.save(); noCentro(ctx, o);
    caminhoForma(ctx, o); ctx.fillStyle = o.cor; ctx.fill();
    if (o.cor.toLowerCase() === "#fffdf3") { ctx.strokeStyle = "rgba(31,24,35,.35)"; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.restore();
  } else if (o.t === "bicho") {
    const img = imagens[o.b];
    if (!img || !img.complete || !img.naturalWidth) {
      ctx.save(); ctx.setLineDash([10, 8]); ctx.strokeStyle = "rgba(31,24,35,.4)"; ctx.lineWidth = 3;
      ctx.strokeRect(o.x - o.w / 2, o.y - o.h / 2, o.w, o.h);
      ctx.fillStyle = "rgba(31,24,35,.6)"; ctx.font = "600 22px Inter, sans-serif"; ctx.textAlign = "center";
      ctx.fillText(BICHOS[o.b].falhou ? "Imagem não encontrada" : "Carregando…", o.x, o.y); ctx.restore(); return;
    }
    const r = recorte(o.b);
    const iw = o.w / (r.x1 - r.x0), ih = o.h / (r.y1 - r.y0);
    ctx.save(); noCentro(ctx, o);
    ctx.drawImage(img, -o.w / 2 - r.x0 * iw, -o.h / 2 - r.y0 * ih, iw, ih);
    ctx.restore();
  }
}

function caixa(o) {
  if (o.t === "traco") {
    let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
    o.pts.forEach(([x, y]) => { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); });
    const m = o.esp / 2;
    return { x: a - m, y: b - m, w: c - a + 2 * m, h: d - b + 2 * m };
  }
  if (!o.rot) return { x: o.x - o.w / 2, y: o.y - o.h / 2, w: o.w, h: o.h };
  // caixa que envolve a forma girada
  const c = Math.abs(Math.cos(o.rot * RAD)), s = Math.abs(Math.sin(o.rot * RAD));
  const w = o.w * c + o.h * s, h = o.w * s + o.h * c;
  return { x: o.x - w / 2, y: o.y - h / 2, w, h };
}

function desenharCena(ctx, escala, comSelecao) {
  ctx.save();
  ctx.scale(escala, escala);     // respeita deslocamentos já aplicados (ex.: na imagem salva)
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  desenharCenario(ctx, estado.cenario);
  estado.objetos.forEach(o => desenharObjeto(ctx, o));
  if (comSelecao && selecionado >= 0 && estado.objetos[selecionado]) {
    const o = estado.objetos[selecionado], m = 10;
    // contorno da seleção acompanha o giro da forma ou do bicho
    let c;
    if (o.t === "traco") c = caixa(o);
    else { noCentro(ctx, o); c = { x: -o.w / 2, y: -o.h / 2, w: o.w, h: o.h }; }
    ctx.lineWidth = 7; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.setLineDash([]);
    ctx.strokeRect(c.x - m, c.y - m, c.w + 2 * m, c.h + 2 * m);
    ctx.lineWidth = 4; ctx.strokeStyle = "#0878b5"; ctx.setLineDash([16, 10]);
    ctx.strokeRect(c.x - m, c.y - m, c.w + 2 * m, c.h + 2 * m);
  }
  ctx.restore();
}

function miniBicho(id, altura) {
  const v = BICHOS[id].visivel, [nw, nh] = TAM_ORIGINAL;

  return `<span class="recorte" style="--ar:${(v[2] - v[0]) / (v[3] - v[1])};--alt:${altura}px">${imgTag(BICHOS[id].src, "", estilo)}</span>`;
}

function amostraCenario(k) {
  return { claro: "#fffdf3", ceu: "linear-gradient(#bfe6fa,#eef8fd)", jardim: `linear-gradient(#e2f4fc 0 60%,${GRAMA} 60%)`, lago: `linear-gradient(#e2f4fc 0 45%,${GRAMA} 45% 60%,#7fcdf2 60%)` }[k];
}

// O canvas ocupa o maior tamanho 3:2 que cabe na área (as coordenadas da cena continuam 1200×800)
function ajustarTela(area) {
  if (!tela || !document.body.contains(tela)) return;
  const larg = area.clientWidth, alt = area.clientHeight;
  if (!larg || !alt) return;
  const css = Math.max(0.1, Math.min(larg / W, alt / H));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  tela.style.width = Math.floor(W * css) + "px";
  tela.style.height = Math.floor(H * css) + "px";
  tela.width = Math.floor(W * css * dpr);
  tela.height = Math.floor(H * css * dpr);
  escalaTela = css * dpr;
  desenharTudo();
}
let pedidoQuadro = 0;
function desenharTudo() {
  if (!ctxTela || !document.body.contains(tela)) return;
  cancelAnimationFrame(pedidoQuadro);
  pedidoQuadro = requestAnimationFrame(() => {
    ctxTela.setTransform(1, 0, 0, 1, 0, 0);
    ctxTela.clearRect(0, 0, tela.width, tela.height);
    desenharCena(ctxTela, escalaTela, true);
  });
}

function registrar() { // guarda o estado antes de cada mudança (para DESFAZER)

  if (historico.length > 60) historico.shift();
}
function mudou() { desenharTudo(); atualizarControles(); guardar(); }

function atualizarControles() {

  app.querySelectorAll("[data-cenario]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cenario === estado.cenario)));
  app.querySelectorAll("[data-forma] svg").forEach(s => { s.style.color = corAtual(); });
  ["menor", "maior", "girar", "apagar"].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = !sel; });
  const d = document.getElementById("desfazer"); if (d) d.disabled = historico.length === 0;
  const l = document.getElementById("limpar"); if (l) l.disabled = estado.objetos.length === 0 && estado.cenario === "claro";
  if (tela) { tela.classList.toggle("modo-mover", estado.ferramenta === "mover"); }

function ligarFerramentas() {

  app.querySelectorAll("[data-cor]").forEach(b => b.addEventListener("click", () => {

  app.querySelectorAll("[data-cenario]").forEach(b => b.addEventListener("click", () => {
    if (estado.cenario === b.dataset.cenario) return;

  document.getElementById("maior").addEventListener("click", () => redimensionar(1.2));
  document.getElementById("girar").addEventListener("click", girar);
  document.getElementById("menor").addEventListener("click", () => redimensionar(1 / 1.2));
  document.getElementById("apagar").addEventListener("click", apagarSelecionado);
  document.getElementById("desfazer").addEventListener("click", desfazer);
  document.getElementById("limpar").addEventListener("click", () =>
    confirmar("Limpar tudo?", "Todos os desenhos, formas e bichos da cena serão apagados.", "SIM, LIMPAR TUDO", () => {
      registrar(); estado.objetos = []; estado.cenario = "claro"; selecionado = -1; mudou();
    }));
}

function redimensionar(f) {
  const o = estado.objetos[selecionado];
  if (!o) return;
  const c = caixa(o), lado = Math.max(c.w, c.h) * f;
  if (lado < 40 || lado > 1400) return;
  registrar();
  if (o.t === "traco") {
    const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
    o.pts = o.pts.map(([x, y]) => [r1(cx + (x - cx) * f), r1(cy + (y - cy) * f)]);
  } else { o.w = r1(o.w * f); o.h = r1(o.h * f); }
  mudou();
}
const GIRO = 45;   // cada toque gira 45° (os ângulos do tangram)
function girar() {
  const o = estado.objetos[selecionado];
  if (!o) return;
  registrar();
  if (o.t === "traco") {
    const c = caixa(o), cx = c.x + c.w / 2, cy = c.y + c.h / 2, a = GIRO * RAD;
    o.pts = o.pts.map(([x, y]) => [r1(cx + (x - cx) * Math.cos(a) - (y - cy) * Math.sin(a)), r1(cy + (x - cx) * Math.sin(a) + (y - cy) * Math.cos(a))]);
  } else o.rot = ((o.rot || 0) + GIRO) % 360;
  moverObjeto(o, 0, 0);   // mantém dentro da área de desenho
  mudou();
}
function apagarSelecionado() {
  if (selecionado < 0) return;
  registrar(); estado.objetos.splice(selecionado, 1); selecionado = -1; mudou();
}
function desfazer() {
  const s = historico.pop();
  if (!s) return;
  const d = JSON.parse(s);
  estado.cenario = d.c; estado.objetos = d.o; selecionado = -1; mudou();
}
const r1 = n => Math.round(n * 10) / 10;

// Encontra o elemento mais à frente sob o ponto
function acertar(x, y) {
  for (let i = estado.objetos.length - 1; i >= 0; i--) {
    const o = estado.objetos[i], c = caixa(o), folga = 14;
    if (x < c.x - folga || x > c.x + c.w + folga || y < c.y - folga || y > c.y + c.h + folga) continue;
    if (o.t !== "traco") {
      // ponto nas coordenadas da própria forma (desfazendo o giro)
      const a = -(o.rot || 0) * RAD, dx0 = x - o.x, dy0 = y - o.y;
      const lx = dx0 * Math.cos(a) - dy0 * Math.sin(a), ly = dx0 * Math.sin(a) + dy0 * Math.cos(a);
      if (o.t === "bicho" || o.f === "quadrado" || o.f === "retangulo") {
        if (Math.abs(lx) <= o.w / 2 + folga && Math.abs(ly) <= o.h / 2 + folga) return i; continue;
      }
      if (o.f === "circulo") {
        const ex = lx / (o.w / 2 + folga), ey = ly / (o.h / 2 + folga);
        if (ex * ex + ey * ey <= 1) return i; continue;
      }
      if (o.f === "triangulo") {
        if (ly < -o.h / 2 - folga || ly > o.h / 2 + folga) continue;
        const meia = (o.w / 2) * Math.max(0, (ly + o.h / 2) / o.h) + folga;
        if (Math.abs(lx) <= meia) return i; continue;
      }
    }
    if (o.t === "traco") {
      const lim = o.esp / 2 + folga, p = o.pts;
      if (p.length === 1 && Math.hypot(x - p[0][0], y - p[0][1]) <= lim) return i;
      for (let k = 0; k < p.length - 1; k++) if (distSeg(x, y, p[k], p[k + 1]) <= lim) return i;
    }
  }
  return -1;
}
function distSeg(x, y, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
  let t = l ? ((x - a[0]) * dx + (y - a[1]) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(x - (a[0] + t * dx), y - (a[1] + t * dy));
}

// Mouse, caneta e toque com o mesmo código (Pointer Events). Só a área de desenho bloqueia a rolagem.
function ligarTela() {
  let acao = null;
  const ponto = ev => {
    const r = tela.getBoundingClientRect();
    return [Math.max(0, Math.min(W, (ev.clientX - r.left) / r.width * W)), Math.max(0, Math.min(H, (ev.clientY - r.top) / r.height * H))];
  };
  tela.addEventListener("pointerdown", ev => {
    if (ev.button > 0 || acao) return;
    ev.preventDefault();
    try { tela.setPointerCapture(ev.pointerId); } catch (e) {}
    const [x, y] = ponto(ev);
    if (estado.ferramenta === "lapis") {
      registrar();
      const traco = { t: "traco", cor: corAtual(), esp: ESPESSURA, pts: [[r1(x), r1(y)]] };
      estado.objetos.push(traco);
      acao = { tipo: "lapis", id: ev.pointerId, traco };
      desenharTudo();
      return;
    }
    const i = acertar(x, y);
    selecionado = i;
    if (i >= 0) {
      acao = { tipo: "mover", id: ev.pointerId, x, y, antes: JSON.stringify({ c: estado.cenario, o: estado.objetos }), moveu: false };
      tela.classList.add("arrastando");
    }
    mudou();
  });
  tela.addEventListener("pointermove", ev => {
    if (!acao || ev.pointerId !== acao.id) return;
    ev.preventDefault();
    const eventos = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
    if (acao.tipo === "lapis") {
      (eventos.length ? eventos : [ev]).forEach(e => {
        const [x, y] = ponto(e), p = acao.traco.pts, u = p[p.length - 1];
        if (Math.hypot(x - u[0], y - u[1]) >= 2) p.push([r1(x), r1(y)]);
      });
      desenharTudo();
    } else {
      const [x, y] = ponto(ev), o = estado.objetos[selecionado];
      let dx = x - acao.x, dy = y - acao.y;
      if (!o || (!acao.moveu && Math.hypot(dx, dy) < 3)) return;
      acao.moveu = true; acao.x = x; acao.y = y;
      moverObjeto(o, dx, dy);
      desenharTudo();
    }
  });
  const fim = ev => {
    if (!acao || ev.pointerId !== acao.id) return;
    if (acao.tipo === "mover" && acao.moveu) { historico.push(acao.antes); if (historico.length > 60) historico.shift(); }
    acao = null; tela.classList.remove("arrastando");
    mudou();
  };
  tela.addEventListener("pointerup", fim);
  tela.addEventListener("pointercancel", fim);
  // Teclado: setas movem o elemento escolhido; Delete apaga; Esc tira a seleção
  tela.addEventListener("keydown", ev => {
    const o = estado.objetos[selecionado];
    const passo = ev.shiftKey ? 40 : 12;
    const mov = { ArrowLeft: [-passo, 0], ArrowRight: [passo, 0], ArrowUp: [0, -passo], ArrowDown: [0, passo] }[ev.key];
    if (mov && o) { ev.preventDefault(); registrar(); moverObjeto(o, mov[0], mov[1]); mudou(); }
    else if ((ev.key === "Delete" || ev.key === "Backspace") && o) { ev.preventDefault(); apagarSelecionado(); }
    else if ((ev.key === "r" || ev.key === "R") && o) { ev.preventDefault(); girar(); }
    else if (ev.key === "Escape") { selecionado = -1; mudou(); }
  });
}
// move sem deixar o elemento sair da área de desenho
function moverObjeto(o, dx, dy) {
  const c = caixa(o), cx = c.x + c.w / 2 + dx, cy = c.y + c.h / 2 + dy;
  dx += Math.max(0, -cx) - Math.max(0, cx - W);
  dy += Math.max(0, -cy) - Math.max(0, cy - H);
  if (o.t === "traco") o.pts = o.pts.map(([x, y]) => [r1(x + dx), r1(y + dy)]);
  else { o.x = r1(o.x + dx); o.y = r1(o.y + dy); }
}

// desenha a cena num canvas qualquer, do tamanho em que ele aparece na tela
function desenharEm(cv) {
  const pintar = () => {
    if (!document.body.contains(cv)) return;
    const larg = cv.clientWidth || 600, dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(larg * dpr); cv.height = Math.round(larg * dpr * H / W);
    desenharCena(cv.getContext("2d"), cv.width / W, false);
  };
  pintar();
  Object.values(imagens).forEach(img => { if (!img.complete) img.addEventListener("load", pintar, { once: true }); });
  if (window.ResizeObserver) { observador = new ResizeObserver(pintar); observador.observe(cv); }
}

/* =========================================================
   SALVAR: imagem PNG (quando o navegador permite) ou impressão / PDF
   ========================================================= */
// Testa se o navegador deixa exportar um canvas com os PNG locais (em file:// alguns navegadores bloqueiam)
function podeExportarPNG() {
  try {
    const cv = document.createElement("canvas"); cv.width = cv.height = 4;
    const c = cv.getContext("2d");
    Object.values(imagens).forEach(img => { if (img.complete && img.naturalWidth) c.drawImage(img, 0, 0, 4, 4); });
    cv.toDataURL("image/png");
    return true;
  } catch (e) { return false; }
}

// Monta a composição completa (título + ilustração + história) em um canvas
async function montarComposicao() {
  try { await Promise.all([document.fonts.load('700 60px "Bai Jamjuree"'), document.fonts.load('500 34px Inter')]); } catch (e) {}
  const larg = 1600, m = 90, ilW = larg - 2 * m, ilH = ilW * H / W;
  const medidor = document.createElement("canvas").getContext("2d");
  medidor.font = '700 64px "Bai Jamjuree", sans-serif';
  const linhasT = quebrarLinhas(medidor, estado.titulo.trim(), ilW);
  medidor.font = '500 36px Inter, sans-serif';
  const linhasH = quebrarLinhas(medidor, estado.historia.replace(/\s+$/, ""), ilW);
  const alt = Math.ceil(m + linhasT.length * 78 + 40 + ilH + 56 + linhasH.length * 56 + m);
  const cv = document.createElement("canvas"); cv.width = larg; cv.height = alt;
  const c = cv.getContext("2d");
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, larg, alt);
  c.fillStyle = "#1f1823"; c.textBaseline = "top"; c.textAlign = "center";
  c.font = '700 64px "Bai Jamjuree", sans-serif';
  let y = m; linhasT.forEach(l => { c.fillText(l, larg / 2, y); y += 78; });
  y += 40;
  c.save(); c.translate(m, y); desenharCena(c, ilW / W, false); c.restore();
  c.strokeStyle = "rgba(31,24,35,.25)"; c.lineWidth = 3; c.strokeRect(m, y, ilW, ilH);
  y += ilH + 56;
  c.textAlign = "left"; c.font = '500 36px Inter, sans-serif';
  linhasH.forEach(l => { c.fillText(l, m, y); y += 56; });
  return cv;
}
function quebrarLinhas(c, texto, max) {
  const saida = [];
  texto.split("\n").forEach(par => {
    if (!par.trim()) { saida.push(""); return; }
    let linha = "";
    par.split(/(\s+)/).forEach(pal => {
      const teste = linha + pal;
      if (c.measureText(teste).width <= max || !linha.trim()) {
        // palavra maior que a linha inteira: quebra por letras
        if (c.measureText(teste).width > max && !linha.trim()) {
          let parte = "";
          for (const ch of pal) { if (c.measureText(parte + ch).width > max) { saida.push(parte); parte = ch; } else parte += ch; }
          linha = parte;
        } else linha = teste;
      } else { saida.push(linha.trimEnd()); linha = pal.trimStart(); }
    });
    saida.push(linha.trimEnd());
  });
  return saida;
}
const nomeArquivo = () => (estado.titulo.trim().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "minha-historia") + ".png";

function abrirSalvar() {
  const png = podeExportarPNG();
  const fundo = abrirJanela(`
    <h2 id="janela-titulo">Como você quer salvar?</h2>
    <button class="opcao-salvar" type="button" id="salvar-png" ${png ? "" : "disabled"}>${ICONE.imagem}
      <span><b>BAIXAR IMAGEM</b><small>${png ? "Um arquivo PNG com o título, o desenho e a história." : "Este navegador não permite baixar a imagem quando a página é aberta direto do computador. Use a opção abaixo."}</small></span></button>
    <button class="opcao-salvar" type="button" id="salvar-pdf">${ICONE.impressora}
      <span><b>IMPRIMIR OU SALVAR EM PDF</b><small>${pc() ? "Na janela de impressão, escolha a impressora ou “Salvar como PDF”." : "Na janela de impressão, escolha a impressora ou salvar como PDF."}</small></span></button>
    <div id="salvar-retorno" role="status" aria-live="polite"></div>
    <div class="botoes"><button class="btn btn-contorno" type="button" id="fechar">FECHAR</button></div>`);
  const retorno = fundo.querySelector("#salvar-retorno");
  fundo.querySelector("#fechar").addEventListener("click", () => fecharJanela(fundo));
  fundo.querySelector("#salvar-pdf").addEventListener("click", imprimir);
  fundo.querySelector("#salvar-png").addEventListener("click", async ev => {
    const botao = ev.currentTarget; botao.disabled = true;
    try {
      const cv = await montarComposicao();
      const blob = await new Promise((ok, erro) => { try { cv.toBlob(b => b ? ok(b) : erro(new Error("vazio")), "image/png"); } catch (e) { erro(e); } });
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = nomeArquivo(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      retorno.innerHTML = `<p class="retorno certo">O navegador começou a baixar “${esc(a.download)}”. Procure o arquivo na pasta de downloads.</p>`;
    } catch (e) {
      retorno.innerHTML = `<p class="retorno dica">Não foi possível criar a imagem neste navegador. Use “Imprimir ou salvar em PDF”.</p>`;
    }
    botao.disabled = false;
  });
}

// Versão para impressão: só título, ilustração e história, numa página A4
function prepararImpressao() {
  const sec = document.getElementById("impressao");
  const cv = document.createElement("canvas"); cv.width = 1800; cv.height = 1200;
  desenharCena(cv.getContext("2d"), cv.width / W, false);
  let figura;
  try { figura = new Image(); figura.src = cv.toDataURL("image/png"); figura.alt = ""; }
  catch (e) { figura = cv; cv.style.width = "100%"; cv.style.height = "auto"; cv.style.display = "block"; cv.style.marginBottom = "7mm"; }
  sec.innerHTML = "";
  const h = document.createElement("h1"); h.textContent = estado.titulo;
  const p = document.createElement("p"); p.textContent = estado.historia;
  sec.append(h, figura, p);
  return figura;
}
function imprimir() {
  const fig = prepararImpressao();
  const ir = () => setTimeout(() => window.print(), 50);
  if (fig.tagName === "IMG" && !fig.complete) fig.onload = ir; else ir();
}
window.addEventListener("beforeprint", () => { if (estado.tela === "final" && !document.getElementById("impressao").firstChild) prepararImpressao(); });

/* ---------- Janelas ---------- */
function abrirJanela(html) {
  const fundo = document.createElement("div");
  fundo.className = "modal-fundo";
  fundo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="janela-titulo">${html}</div>`;
  document.body.appendChild(fundo);
  const focaveis = () => [...fundo.querySelectorAll("button:not([disabled])")];
  (focaveis()[0] || fundo).focus();
  fundo.addEventListener("keydown", ev => {
    if (ev.key === "Escape") fecharJanela(fundo);
    if (ev.key === "Tab") { const f = focaveis(), i = f.indexOf(document.activeElement); ev.preventDefault(); f[(i + (ev.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
  });
  return fundo;
}
function fecharJanela(fundo) { fundo.remove(); const s = document.getElementById("salvar") || app; s.focus && s.focus(); }
function confirmar(titulo, texto, sim, aoConfirmar) {
  const fundo = abrirJanela(`<h2 id="janela-titulo">${esc(titulo)}</h2><p class="lead" style="max-width:none">${esc(texto)}</p>
    <div class="botoes"><button class="btn btn-contorno" type="button" id="nao">CANCELAR</button><button class="btn btn-amarelo" type="button" id="sim">${esc(sim)}</button></div>`);
  fundo.querySelector("#nao").addEventListener("click", () => fecharJanela(fundo));
  fundo.querySelector("#sim").addEventListener("click", () => { fundo.remove(); aoConfirmar(); });
}
